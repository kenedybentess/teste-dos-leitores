<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas - Posicionamento Livre</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{background-color:#f4f6f9;display:flex;height:100vh;overflow:hidden}
        .sidebar{width:430px;background:#ffffff;border-right:1px solid #ddd;padding:15px;overflow-y:auto;box-shadow:2px 0 5px rgba(0,0,0,0.05)}
        .sidebar h2{font-size:13px;margin-bottom:8px;color:#333;border-bottom:2px solid #007bff;padding-bottom:3px;margin-top:14px}
        .sidebar h2:first-child{margin-top:0}
        .form-group{margin-bottom:8px}
        .form-group label{display:block;font-size:11px;font-weight:bold;color:#555;margin-bottom:2px}
        .form-group input,.form-group select{width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
        .row-inputs{display:flex;gap:6px}
        .row-inputs .form-group{flex:1}
        .dados-box{background:linear-gradient(135deg,#e7f1ff,#d0e2ff);border:2px solid #0d6efd;border-radius:8px;padding:10px;margin-bottom:12px}
        .elemento-box{background:#f9f9f9;border:1px solid #e0e0e0;padding:8px;border-radius:4px;margin-bottom:8px}
        .elemento-box h4{font-size:11px;color:#007bff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
        .btn-remover{background:#dc3545;color:white;border:none;padding:2px 6px;font-size:10px;border-radius:3px;cursor:pointer}
        .btn-add{background:#17a2b8;color:white;border:none;padding:8px;width:100%;border-radius:4px;cursor:pointer;font-weight:bold;font-size:12px;margin-bottom:8px}
        .print-btn{background:#28a745;color:white;border:none;padding:10px;width:100%;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;margin-top:10px}
        .preview-area{flex:1;display:flex;justify-content:center;align-items:center;background:#e9ecef;padding:20px;overflow:auto}
        #etiqueta{background:#ffffff;border:2px solid #999;position:relative;box-shadow:0 4px 10px rgba(0,0,0,0.2);overflow:hidden}
        .etiqueta-item-preview{position:absolute;user-select:none;touch-action:none;box-sizing:border-box;border:1px dashed #007bff;background-color:rgba(0,123,255,0.03);cursor:move;display:flex;align-items:center;justify-content:center}
        .preview-img{width:100%;height:100%;object-fit:contain;pointer-events:none}
        .preview-ean13{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
        .preview-barcode{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
        .barcode-font{font-family:'Libre Barcode 39',cursive;line-height:1}
        .preview-text{width:100%;height:100%;display:flex;align-items:center;overflow:hidden;pointer-events:none;padding:0 2px}
        .preview-linha{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
        .linha-interna{background-color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        @media print{body{background:none}.sidebar{display:none}.preview-area{background:none;padding:0}#etiqueta{border:none !important;box-shadow:none !important}.etiqueta-item-preview{border:none !important;background:transparent !important}}
    </style>
</head>
<body>
<div class="sidebar">
    <h2 style="border-color:#198754;color:#198754">📦 DADOS DA ETIQUETA - PUXA DO CADASTRO</h2>
    <div class="dados-box">
        <div class="form-group">
            <label>1️⃣ Código do Produto * (início)</label>
            <select id="selectProdutoCodigo" onchange="aoSelecionarProduto(this.value)">
                <option value="">-- Selecione o produto --</option>
            </select>
        </div>
        <div class="row-inputs">
            <div class="form-group"><label>Código Produto:</label><input type="text" id="inputCodProduto" placeholder="Ex: EL250-01" oninput="dadosEtiqueta.codigo=this.value; aplicarDadosNaEtiqueta()"></div>
            <div class="form-group"><label>EAN13:</label><input type="text" id="inputEAN13" maxlength="13" placeholder="7891234567895" oninput="this.value=this.value.replace(/[^0-9]/g,''); dadosEtiqueta.ean13=this.value; aplicarDadosNaEtiqueta()"></div>
        </div>
        <div class="form-group"><label>Descrição / Nome:</label><input type="text" id="inputDescricao" placeholder="Ex: Leitor Elgin EL250" oninput="dadosEtiqueta.descricao=this.value; aplicarDadosNaEtiqueta()"></div>
        <div class="form-group">
            <label>2️⃣ Número de Série (puxa do TESTE):</label>
            <select id="selectSerie" onchange="aoSelecionarSerie(this.value)"><option value="">-- Últimos testes --</option></select>
            <input type="text" id="inputSerie" style="margin-top:4px" placeholder="Ou digite o Nº Série" oninput="dadosEtiqueta.serie=this.value; aplicarDadosNaEtiqueta()">
        </div>
        <button class="btn-add" style="background:#0d6efd;margin-top:6px" onclick="aplicarDadosNaEtiqueta()">🔄 Aplicar na Etiqueta</button>
    </div>

    <h2>Configurar Etiqueta</h2>
    <div class="row-inputs">
        <div class="form-group"><label>Largura (mm):</label><input type="number" id="inputWidth" value="100" oninput="renderizarEtiqueta()"></div>
        <div class="form-group"><label>Altura (mm):</label><input type="number" id="inputHeight" value="60" oninput="renderizarEtiqueta()"></div>
    </div>

    <h2>Elementos da Etiqueta</h2>
    <div id="container-elementos-form"></div>
    <button class="btn-add" onclick="adicionarElemento()">+ Adicionar Elemento</button>
    <button class="btn-add" style="background-color:#6c757d;" onclick="centralizarElementos()">Organizar em Pilha</button>
    <button class="print-btn" onclick="window.print()">Imprimir Etiqueta</button>

<script>
let dadosEtiqueta={codigo:'PROD-001', descricao:'Peça Industrial Exemplo', ean13:'7891234567895', serie:'SN12345678'};
let elementos=[
    {id:1, tipo:'texto', campo:'codigo', valor:'Cód: PROD-001', x:5, y:5, w:90, h:7, tamFonte:12, negrito:true},
    {id:2, tipo:'linha', valor:'', x:5, y:12, w:90, h:1, orientacao:'horizontal', espessuraLinha:1},
    {id:3, tipo:'texto', campo:'descricao', valor:'Descrição: Peça Industrial Exemplo', x:5, y:14, w:90, h:7, tamFonte:10, negrito:false},
    {id:4, tipo:'texto', campo:'serie', valor:'S/N: SN12345678', x:5, y:22, w:90, h:7, tamFonte:10, negrito:false},
    {id:5, tipo:'ean13', campo:'ean13', valor:'7891234567895', x:5, y:30, w:90, h:22, tamTexto:10}
];
let idContador=6;
function mmParaPx(mm){return mm*(96/25.4);} function pxParaMm(px){return px/(96/25.4);}
function carregarProdutosSelect(){
    const sel=document.getElementById('selectProdutoCodigo');
    try{
        const produtos=JSON.parse(localStorage.getItem('produtos')||'[]');
        sel.innerHTML='<option value="">-- Selecione o produto --</option>';
        if(produtos.length===0){ sel.innerHTML+='<option disabled>Nenhum produto cadastrado</option>'; return; }
        produtos.forEach(p=>{
            const opt=document.createElement('option'); opt.value=p.id; opt.textContent=`${p.codigo} - ${p.nome} ${p.ean13? '('+p.ean13+')':''}`; sel.appendChild(opt);
        });
    }catch(e){}
}
function carregarSeriesSelect(){
    const sel=document.getElementById('selectSerie');
    try{
        const testes=JSON.parse(localStorage.getItem('testes')||'[]');
        sel.innerHTML='<option value="">-- Últimos testes (20) --</option>';
        if(testes.length===0){ sel.innerHTML+='<option disabled>Nenhum teste encontrado</option>'; return; }
        testes.slice(0,20).forEach(t=>{
            const opt=document.createElement('option'); opt.value=t.serie||t.numeroSerie||''; opt.textContent=`${t.serie||''} - ${t.produtoCodigo||''} (${t.resultado||''})`; sel.appendChild(opt);
        });
    }catch(e){}
}
function aoSelecionarProduto(prodId){
    if(!prodId) return;
    try{
        const produtos=JSON.parse(localStorage.getItem('produtos')||'[]');
        const p=produtos.find(x=>x.id===prodId);
        if(!p) return;
        dadosEtiqueta.codigo=p.codigo||''; dadosEtiqueta.descricao=p.nome||p.descricao||''; dadosEtiqueta.ean13=p.ean13||'';
        document.getElementById('inputCodProduto').value=dadosEtiqueta.codigo;
        document.getElementById('inputDescricao').value=dadosEtiqueta.descricao;
        document.getElementById('inputEAN13').value=dadosEtiqueta.ean13;
        aplicarDadosNaEtiqueta();
    }catch(e){}
}
function aoSelecionarSerie(serie){ if(!serie) return; dadosEtiqueta.serie=serie; document.getElementById('inputSerie').value=serie; aplicarDadosNaEtiqueta(); }
function aplicarDadosNaEtiqueta(){
    elementos.forEach(el=>{
        if(el.campo==='codigo'){ el.valor=`Cód: ${dadosEtiqueta.codigo}`; }
        else if(el.campo==='descricao'){ el.valor=`Descrição: ${dadosEtiqueta.descricao}`; }
        else if(el.campo==='ean13'){ el.valor=dadosEtiqueta.ean13||'7891234567895'; }
        else if(el.campo==='serie'){ el.valor=`S/N: ${dadosEtiqueta.serie}`; }
    });
    renderizarTudo();
}
function inicializarFormulario(){
    const container=document.getElementById('container-elementos-form'); container.innerHTML='';
    elementos.forEach((el)=>{
        let htmlCampos='';
        if(el.tipo==='texto'){
            htmlCampos=`<div class="form-group"><label>Texto: ${el.campo? '<span style="color:#0d6efd">['+el.campo+']</span>':''}</label><input type="text" value="${el.valor}" oninput="atualizarDado(${el.id}, 'valor', this.value)"></div><div class="row-inputs"><div class="form-group"><label>Fonte:</label><input type="number" value="${el.tamFonte}" oninput="atualizarDado(${el.id}, 'tamFonte', parseInt(this.value))"></div><div class="form-group"><label>Negrito:</label><select onchange="atualizarDado(${el.id}, 'negrito', this.value==='true')"><option value="true" ${el.negrito?'selected':''}>Sim</option><option value="false" ${!el.negrito?'selected':''}>Não</option></select></div></div><div class="form-group"><label>Vincular:</label><select onchange="atualizarDado(${el.id}, 'campo', this.value)"><option value="">Manual</option><option value="codigo" ${el.campo==='codigo'?'selected':''}>Código Produto</option><option value="descricao" ${el.campo==='descricao'?'selected':''}>Descrição</option><option value="serie" ${el.campo==='serie'?'selected':''}>Nº Série (teste)</option></select></div>`;
        } else if(el.tipo==='imagem'){
            htmlCampos=`<div class="form-group"><label>Arquivo:</label><input type="file" accept="image/*" onchange="carregarImagemLocal(${el.id}, event)"></div>`;
        } else if(el.tipo==='barcode'){
            htmlCampos=`<div class="form-group"><label>Texto:</label><input type="text" value="${el.valor}" oninput="atualizarDado(${el.id}, 'valor', this.value)"></div>`;
        } else if(el.tipo==='ean13'){
            htmlCampos=`<div class="form-group"><label style="color:#0d6efd">EAN13 [${el.campo||'manual'}]:</label><input type="text" value="${el.valor}" maxlength="13" oninput="this.value=this.value.replace(/[^0-9]/g,''); atualizarDado(${el.id}, 'valor', this.value)"></div><div class="form-group"><label>Vincular:</label><select onchange="atualizarDado(${el.id}, 'campo', this.value)"><option value="">Manual</option><option value="ean13" ${el.campo==='ean13'?'selected':''}>EAN13 do Produto</option></select></div>`;
        } else if(el.tipo==='linha'){
            htmlCampos=`<div class="row-inputs"><div class="form-group"><label>Orientação:</label><select onchange="atualizarDado(${el.id}, 'orientacao', this.value)"><option value="horizontal" ${el.orientacao==='horizontal'?'selected':''}>Horizontal</option><option value="vertical" ${el.orientacao==='vertical'?'selected':''}>Vertical</option></select></div><div class="form-group"><label>Espessura:</label><input type="number" step="0.5" value="${el.espessuraLinha||1}" oninput="atualizarDado(${el.id}, 'espessuraLinha', parseFloat(this.value))"></div></div>`;
        }
        const divBox=document.createElement('div'); divBox.className='elemento-box'; divBox.innerHTML=`<h4><span>${el.tipo.toUpperCase()} ${el.campo?'🔗':''}</span><button class="btn-remover" onclick="removerElemento(${el.id})">Remover</button></h4>${htmlCampos}<div class="row-inputs" style="margin-top:5px;"><div class="form-group"><label>L (mm):</label><input type="number" value="${el.w.toFixed(1)}" oninput="atualizarDimensoes(${el.id}, 'w', this.value)"></div><div class="form-group"><label>A (mm):</label><input type="number" value="${el.h.toFixed(1)}" oninput="atualizarDimensoes(${el.id}, 'h', this.value)"></div></div>`; container.appendChild(divBox);
    });
}
function carregarImagemLocal(id,event){ const arq=event.target.files[0]; if(arq){ const r=new FileReader(); r.onload=e=>atualizarDado(id,'valor',e.target.result); r.readAsDataURL(arq);} }
function adicionarElemento(){ let tipo=prompt("Tipo:\n- texto\n- imagem\n- barcode\n- ean13\n- linha","ean13"); if(!tipo) return; tipo=tipo.toLowerCase().trim(); if(!['texto','imagem','barcode','ean13','linha'].includes(tipo)) return; let novoW=tipo==='ean13'?70:80; let novoH=tipo==='ean13'?18:15; elementos.push({id:idContador++, tipo:tipo, valor:tipo==='texto'?'Novo Texto':(tipo==='ean13'?'7891234567895':''), x:5, y:35, w:novoW, h:novoH, tamFonte:11, negrito:false, tamTexto:10, orientacao:'horizontal', espessuraLinha:1, campo:''}); renderizarTudo(); }
function removerElemento(id){ elementos=elementos.filter(e=>e.id!==id); renderizarTudo(); }
function atualizarDado(id,campo,valor){ const el=elementos.find(e=>e.id===id); if(el){ el[campo]=valor; renderizarEtiqueta(); } }
function atualizarDimensoes(id,campo,valor){ const el=elementos.find(e=>e.id===id); if(el){ el[campo]=parseFloat(valor)||0.5; renderizarEtiqueta(); } }
function centralizarElementos(){ let y=5; elementos.forEach(el=>{ el.x=5; el.y=y; y+=el.h+2; }); renderizarTudo(); }
function renderizarEtiqueta(){
    const larguraMm=parseFloat(document.getElementById('inputWidth').value)||100; const alturaMm=parseFloat(document.getElementById('inputHeight').value)||60; const etiqueta=document.getElementById('etiqueta'); etiqueta.style.width=mmParaPx(larguraMm)+'px'; etiqueta.style.height=mmParaPx(alturaMm)+'px'; etiqueta.innerHTML='';
    elementos.forEach((el)=>{
        const itemDiv=document.createElement('div'); itemDiv.className='etiqueta-item-preview'; itemDiv.setAttribute('data-id',el.id); itemDiv.style.left=mmParaPx(el.x)+'px'; itemDiv.style.top=mmParaPx(el.y)+'px'; itemDiv.style.width=mmParaPx(el.w)+'px'; itemDiv.style.height=mmParaPx(el.h)+'px';
        if(el.tipo==='texto'){ const inner=document.createElement('div'); inner.className='preview-text'; inner.innerText=el.valor; inner.style.fontSize=(el.tamFonte||11)+'px'; inner.style.fontWeight=el.negrito?'bold':'normal'; itemDiv.appendChild(inner); }
        else if(el.tipo==='imagem'){ if(el.valor){ const img=document.createElement('img'); img.className='preview-img'; img.src=el.valor; itemDiv.appendChild(img);} }
        else if(el.tipo==='barcode'){ const bcDiv=document.createElement('div'); bcDiv.className='preview-barcode'; let tv=el.valor.toUpperCase(); if(!tv.startsWith('*')) tv='*'+tv; if(!tv.endsWith('*')) tv=tv+'*'; bcDiv.innerHTML=`<div class="barcode-font" style="font-size:${el.tamanhoBarra||42}px;">${tv}</div><div class="barcode-text" style="font-size:${el.tamTexto||9}px;">${el.valor.toUpperCase()}</div>`; itemDiv.appendChild(bcDiv); }
        else if(el.tipo==='ean13'){ if(el.valor){ const eanDiv=document.createElement('div'); eanDiv.className='preview-ean13'; const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.style.width='100%'; svg.style.height='100%'; eanDiv.appendChild(svg); itemDiv.appendChild(eanDiv); setTimeout(()=>{ try{ JsBarcode(svg, el.valor, {format:"EAN13", displayValue:true, fontSize:el.tamTexto||10, textMargin:2, margin:0, width:1.5, height:40, background:"#ffffff"});}catch(err){ svg.innerHTML=`<text x="5" y="15" font-size="10" fill="red">EAN inválido</text>`; } },0); } }
        else if(el.tipo==='linha'){ const linhaDiv=document.createElement('div'); linhaDiv.className='preview-linha'; let esp=mmParaPx(el.espessuraLinha||1); const li=document.createElement('div'); li.className='linha-interna'; if(el.orientacao==='vertical'){ li.style.width=esp+'px'; li.style.height='100%'; } else { li.style.width='100%'; li.style.height=esp+'px'; } linhaDiv.appendChild(li); itemDiv.appendChild(linhaDiv); }
        etiqueta.appendChild(itemDiv);
    });
    ativarArrasto();
}
function ativarArrasto(){ interact('.etiqueta-item-preview').draggable({ inertia:true, modifiers:[interact.modifiers.restrictRect({restriction:'parent',endOnly:true})], listeners:{ move(event){ const target=event.target; const id=parseInt(target.getAttribute('data-id')); const elData=elementos.find(e=>e.id===id); if(elData){ elData.x+=pxParaMm(event.dx); elData.y+=pxParaMm(event.dy); target.style.left=mmParaPx(elData.x)+'px'; target.style.top=mmParaPx(elData.y)+'px'; } } } }); }
function renderizarTudo(){ inicializarFormulario(); renderizarEtiqueta(); }
window.onload=()=>{ carregarProdutosSelect(); carregarSeriesSelect(); renderizarTudo(); };
</script>
